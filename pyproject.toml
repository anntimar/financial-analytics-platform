[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finanalytics"
version = "0.1.0"
description = "Plataforma de analytics financeiro para pequenas empresas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "faker>=30,<40",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.41,<2",
  "uvicorn[standard]>=0.32,<1",
  "bcrypt>=4,<6",
  "pyjwt>=2.10,<3",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=95"
markers = ["integration: tests that require a live PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas", "plotly", "plotly.*"]
ignore_missing_imports = true
